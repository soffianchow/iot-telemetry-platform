[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-ops-lab"
version = "0.1.0"
description = "Hardware-free MQTT operations platform"
requires-python = ">=3.11"
dependencies = ["paho-mqtt>=2.1,<3", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
iot-ops = "iot_ops.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
iot_ops = ["*.json", "*.html"]
